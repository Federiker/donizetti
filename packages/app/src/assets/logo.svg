<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Donizetti</title>
  <!-- Donizetti's logo (CC0-1.0, made for this repository): a "D" whose upright is a quaver's stem,
       its bowl the flag and a notehead at its foot. The app's `icons` script makes its icons from it
       (src-tauri/icons). -->
  <rect width="1024" height="1024" rx="224" fill="#7a1f3d" />
  <path
    d="M 478 250 H 548 A 235 235 0 0 1 548 720 H 478"
    fill="none"
    stroke="#fdf6e3"
    stroke-width="72"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <rect x="442" y="214" width="72" height="542" rx="36" fill="#fdf6e3" />
  <ellipse cx="360" cy="742" rx="140" ry="100" transform="rotate(-22 360 742)" fill="#fdf6e3" />
</svg>
