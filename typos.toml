# typos checks spelling in code and docs, in UK English (owner decision, 27 October 2026; see
# docs/development.md, decision 12). Every allowed word below says why it is allowed.

[default]
locale = "en-gb"

[default.extend-words]
# Names other software fixes: serde's Serialize, CSS and the DOM (`color`, `center`, `behavior`), HTML's
# <dialog>, Bun's `catalog`, OSMD's `Normalize…`, GitHub's upload-artifact action, the sha2 crate's
# `finalize`, HTTP's `Authorization` header (scripts/release/github.ts) and Vite's `optimizeDeps`.
serialize = "serialize"
serializer = "serializer"
serializes = "serializes"
normalize = "normalize"
normalized = "normalized"
color = "color"
colors = "colors"
center = "center"
behavior = "behavior"
dialog = "dialog"
catalog = "catalog"
artifact = "artifact"
finalize = "finalize"
authorization = "authorization"
optimize = "optimize"
# MusicXML's own element and attribute names (`<harmony>`, `color`, `<syllabic>`…) are spelt as the
# W3C wrote them.
syllabic = "syllabic"
# Music's own words: a tuplet (a triplet, say) is not a tuple, and "16ths" are sixteenth notes.
tuplet = "tuplet"
tuplets = "tuplets"
ths = "ths"

[files]
extend-exclude = [
  "*.lock",
  # Other programs' files used as test input.
  "LICENSE",
  "**/tests/fixtures/",
  # Scores: MusicXML spells its elements as the W3C wrote them (`<millimeters>`).
  "*.musicxml",
  "**/licences/",
  "**/notices/",
  # Tauri writes the plugin's permission reference and schema (crates/tauri-plugin/build.rs).
  "crates/tauri-plugin/permissions/autogenerated/",
  "crates/tauri-plugin/permissions/schemas/",
]
