[workspace]
resolver = "3"
members = [
  "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "CC0-1.0"
repository = "https://github.com/Federiker/donizetti"
# Not on crates.io yet (owner decision, 27 October 2026; see docs/development.md, decision 11).
publish = false

[workspace.dependencies]
donizetti_pdf = { path = "crates/pdf" }
donizetti_soundfonts = { path = "crates/soundfonts" }
# pdf-writer's version is the one svg2pdf writes with (its pages are chunks of that PDF writer).
pdf-writer = "0.12"
# The soundfont download over HTTPS, with rustls and its bundled roots (as jerome).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
# SVG pages to PDF (MIT OR Apache-2.0), read by usvg 0.45 (re-exported by svg2pdf, so the two never
# drift apart). Its default features: text, and images and filters, which it would otherwise skip.
svg2pdf = "0.13"
# Temporary folders in the tests.
tempfile = "3.23.0"
tokio = { version = "1", features = ["rt", "time", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Panics outside tests are explicit (`#[expect(..., reason = ...)]`); tests may unwrap (clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
assert_is_empty = "allow"

# Less debug info in dev builds and tests: line tables for our crates (enough
# for backtraces), none for dependencies. Smaller files, faster linking.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Full debug info for Donizetti's crates in debugger sessions (`cargo build
# --profile debugging`, used by .vscode/launch.json); line tables only for
# dependencies. Kept in target/debugging so it never invalidates the everyday
# dev build.
[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = "line-tables-only"
