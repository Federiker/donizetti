# Developer tools, pinned (owner decision, 27 October 2026; see docs/development.md, decision 12).
# `mise install` installs them; scripts/install.bat and scripts/install.sh set up a whole machine.
# Rust itself is pinned in rust-toolchain.toml and installed by rustup.
min_version = "2026.10.0"

[settings]
# mise.lock records each tool's exact version and checksums, as bun.lock does for the packages.
lockfile = true

[env]
# The packages' programs (biome, vitest, knip, tsc…) run without `bun x`.
_.path = ["{{config_root}}/node_modules/.bin"]

[tools]
bun = "1.4.2"
# Lets the `cargo:` tools below install prebuilt binaries instead of compiling.
cargo-binstall = "1.26.0"
"cargo:cargo-nextest" = "0.9.149"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-llvm-cov" = "0.9.1"
cargo-deny = "0.20.2"
typos = "1.51.1"
lychee = "0.24.2"
lefthook = "2.2.2"

# The repository's commands: `mise run <task>` (`mise tasks` lists them). Arguments after the
# task's name are passed on, e.g. `mise run rust:test -p donizetti_soundfonts`. The packages'
# own scripts stay in their package.json (`bun run --filter <package> <script>`).

# Develop.
[tasks.dev]
description = "The demo app in the browser (Vite)"
run = "bun run --filter @donizetti/app dev"

[tasks."tauri:dev"]
description = "The demo app as a native desktop app"
run = "bun run --filter @donizetti/app tauri:dev"

# Build.
[tasks.build]
description = "The demo app's production build (the packages are used from their sources)"
run = "bun run --filter @donizetti/app build"

[tasks.clean]
description = "Remove build outputs"
run = "bun scripts/clean.ts"

# Release (decision 11): the packages' tarballs on a GitHub release; the plugin is taken by git at its tag.
[tasks."release:dry"]
description = "Check, build and verify the release's tarballs and list what releasing does (--allow-dirty, --skip-checks)"
run = "bun scripts/release.ts"

[tasks.release]
description = "Release the pushed tag v<version>: the GitHub release and its tarballs (GITHUB_TOKEN in .env)"
run = "bun scripts/release.ts --release"

# Check.
[tasks.check]
description = "Biome (formatting and lint)"
run = "biome ci"

[tasks.lint]
description = "Biome lint rules"
run = "biome lint"

[tasks.format]
description = "Format the TypeScript, JSON and CSS"
run = "biome format --write"

[tasks.fix]
description = "Format and apply safe fixes, TypeScript and Rust"
run = ["biome check --write", "cargo fmt --all"]

[tasks.typecheck]
description = "TypeScript check of every package and the scripts"
run = ["bun run --filter \"@donizetti/*\" typecheck", "tsc --build scripts"]

[tasks.knip]
description = "Unused files, dependencies and exports"
run = "knip"

[tasks.spell]
description = "Spelling (typos.toml)"
run = "typos"

[tasks.links]
description = "Broken links in the Markdown files"
run = "bun scripts/links.ts"

[tasks.audit]
description = "Advisories and licences of the packages and crates"
run = ["bun audit", "bun scripts/licences.ts", "cargo deny check"]

[tasks."rust:check"]
description = "cargo check of the workspace"
run = "cargo check --workspace"

[tasks."rust:fmt"]
description = "Check the Rust formatting"
run = "cargo fmt --all --check"

[tasks."rust:clippy"]
description = "Clippy, warnings denied"
run = "cargo clippy --workspace --all-targets -- --deny warnings"

[tasks."rust:machete"]
description = "Unused Rust dependencies"
run = "cargo machete"

[tasks."rust:deny"]
description = "Rust licences, bans and sources (advisories run weekly in CI)"
run = "cargo deny check licenses bans sources"

[tasks.licences]
description = "The npm packages' licences: permissive only (decision 1)"
run = "bun scripts/licences.ts"

# Test.
[tasks.test]
description = "Every package's TypeScript tests"
run = "vitest run"

[tasks.coverage]
description = "The TypeScript tests, at 80% coverage or more"
run = "vitest run --coverage --testTimeout=60000"

[tasks."test:e2e"]
description = "Playwright tests of the demo app (install the browser once with e2e:browser)"
run = "bun run --filter @donizetti/e2e test"

[tasks."e2e:browser"]
description = "Install Playwright's browser (--with-deps adds its Linux system packages)"
dir = "tests/e2e"
run = "playwright install chromium"

[tasks."rust:test"]
description = "The Rust tests, with nextest when installed"
run = "bun scripts/rust-test.ts"

[tasks."rust:coverage"]
description = "The Rust tests, at 80% coverage or more (CI adds --profile ci)"
run = "cargo llvm-cov nextest --workspace --fail-under-lines 80 --fail-under-regions 80"

# What CI's Checks workflow runs, in its order: the quick checks first, so they fail fast.
[tasks.ci]
description = "Every check CI runs"
run = [
  { tasks = ["check", "rust:fmt", "spell", "links", "knip", "licences"] },
  { task = "typecheck" },
  { tasks = ["rust:machete", "rust:deny"] },
  { task = "rust:clippy" },
  { task = "coverage" },
  { task = "rust:coverage" },
  { task = "test:e2e" },
  { task = "build" },
]
