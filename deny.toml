# cargo-deny: licences, bans, sources and security advisories for the Rust dependencies
# (owner decision, 27 October 2026; see docs/development.md, decision 1 and 12).
# `mise run audit` runs every check; CI runs licences, bans and sources on every push and the
# advisories weekly.

[advisories]
# Unmaintained crates count only when a Donizetti crate depends on them directly; the ones deep in
# Tauri's dependencies are upstream's to replace.
unmaintained = "workspace"
yanked = "warn"
# Each ignored advisory needs its id and the reason, e.g.
# { id = "RUSTSEC-0000-0000", reason = "..." },
ignore = []

[licenses]
# Donizetti is CC0-1.0, so everything it links must be permissive (decision 1): no GPL, LGPL or
# AGPL. MPL-2.0 is file-level copyleft and appears only deep in Tauri's tree (unchanged files, used
# as they are). A dependency under any other licence fails until the owner approves it here.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
# Donizetti's own crates (`publish = false` until they go to crates.io).
ignore = true

[bans]
# Tauri and its platform crates bring several versions of some crates; reported, not refused.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates are path dependencies.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
