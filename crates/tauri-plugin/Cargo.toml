[package]
name = "tauri-plugin-donizetti"
description = "Donizetti's Tauri plugin: scores read and written, the soundfont, PDF export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# Tauri passes the plugin's permissions to the app's build through this.
links = "tauri-plugin-donizetti"

[dependencies]
donizetti_pdf.workspace = true
donizetti_soundfonts.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri.workspace = true
tempfile.workspace = true

[dev-dependencies]
# The mock runtime, for the commands' tests.
tauri = { workspace = true, features = ["test"] }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[lints]
workspace = true
