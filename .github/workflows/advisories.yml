name: Advisories

# Known vulnerabilities in the npm packages (bun audit) and the Rust crates
# (cargo-deny, RustSec), run by hand from the Actions tab (see
# docs/development.md, decision 12). Kept out of the Checks workflow so a new
# advisory never fails an unrelated check run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: cargo deny check advisories
